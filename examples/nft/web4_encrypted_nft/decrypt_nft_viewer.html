<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted NFT Content Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: monospace;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            display: none;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            color: #333;
            word-wrap: break-word;
            line-height: 1.6;
        }

        .error {
            color: #e74c3c;
            background: #ffe5e5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e8f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
            font-size: 13px;
            color: #555;
        }

        .example-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .example-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 Encrypted NFT Viewer</h1>
        <p class="subtitle">Decrypt and view encrypted NFT content on NEAR</p>

        <div class="info-box">
            💡 <strong>How it works:</strong> This tool retrieves encrypted content from the blockchain and decrypts it locally using your private key. Your key never leaves your browser.
        </div>

        <div class="input-group">
            <label for="network">Network</label>
            <select id="network">
                <option value="testnet">Testnet</option>
                <option value="mainnet">Mainnet</option>
            </select>
        </div>

        <div class="input-group">
            <label for="contract">Contract Address</label>
            <input type="text" id="contract" value="wasmmusic.testnet" placeholder="example.near or example.testnet">
        </div>

        <div class="input-group">
            <label for="tokenId">Token ID</label>
            <input type="text" id="tokenId" value="music_nft_decrypt_test_1761993657835" placeholder="e.g. music_nft_1">
        </div>

        <div class="input-group">
            <label for="privateKey">Private Key (hex)</label>
            <input type="password" id="privateKey" placeholder="Enter your private key in hex format">
        </div>

        <button onclick="decryptContent()">🔐 Decrypt Content</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Retrieving encrypted content from blockchain...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <h3>✨ Decrypted Content</h3>
            <div class="content" id="content"></div>
        </div>
    </div>

    <script type="module">
        // Import @noble/curves for Ristretto255
        import { RistrettoPoint } from 'https://esm.sh/@noble/curves@1.3.0/ed25519';

        // Import NEAR JSON-RPC client
        import { NearRpcClient, viewFunctionAsJson } from 'https://cdn.jsdelivr.net/npm/@near-js/jsonrpc-client@1.4.0/+esm';

        // Make them available globally
        window.RistrettoPoint = RistrettoPoint;
        window.nearJsonRpcClient = { NearRpcClient, viewFunctionAsJson };

        console.log('✅ Ristretto255 and NEAR RPC client loaded');
    </script>

    <script>
        const CURVE_ORDER = 2n ** 252n + 27742317777372353535851937790883648493n;

        function bufferToScalar(buffer) {
            let value = 0n;
            for (let i = buffer.length - 1; i >= 0; i--) {
                value = (value << 8n) | BigInt(buffer[i]);
            }
            value = value % CURVE_ORDER;
            return value === 0n ? 1n : value;
        }

        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
            }
            return bytes;
        }

        function base64ToBytes(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        async function sha256(buffer) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            return new Uint8Array(hashBuffer);
        }

        async function aesDecrypt(key, iv, ciphertext, authTag) {
            // Combine ciphertext and auth tag for Web Crypto API
            const combined = new Uint8Array(ciphertext.length + authTag.length);
            combined.set(ciphertext);
            combined.set(authTag, ciphertext.length);

            const cryptoKey = await crypto.subtle.importKey(
                'raw',
                key,
                { name: 'AES-GCM' },
                false,
                ['decrypt']
            );

            const decrypted = await crypto.subtle.decrypt(
                {
                    name: 'AES-GCM',
                    iv: iv,
                    tagLength: 128
                },
                cryptoKey,
                combined
            );

            return new Uint8Array(decrypted);
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
            document.getElementById('result').classList.remove('show');
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        async function fetchEncryptedContent(network, contract, tokenId) {
            const rpcUrl = network === 'mainnet'
                ? 'https://rpc.mainnet.fastnear.com'
                : 'https://rpc.testnet.fastnear.com';

            // Use NEAR JSON-RPC client
            const client = new nearJsonRpcClient.NearRpcClient(rpcUrl);

            // Prepare the arguments as JSON string, then base64 encode
            const argsJson = JSON.stringify({
                function_name: 'get_encrypted_content_data',
                token_id: tokenId
            });
            const argsBase64 = btoa(argsJson);

            // Call the contract function using viewFunctionAsJson
            const result = await nearJsonRpcClient.viewFunctionAsJson(client, {
                accountId: contract,
                methodName: 'call_js_func',
                argsBase64: argsBase64,
                finality: 'final'
            });

            return result;
        }

        window.decryptContent = async function() {
            // Clear previous results
            document.getElementById('error').classList.remove('show');
            document.getElementById('result').classList.remove('show');

            const network = document.getElementById('network').value;
            const contract = document.getElementById('contract').value.trim();
            const tokenId = document.getElementById('tokenId').value.trim();
            const privateKeyHex = document.getElementById('privateKey').value.trim();

            // Validation
            if (!contract || !tokenId || !privateKeyHex) {
                showError('Please fill in all fields');
                return;
            }

            if (privateKeyHex.length !== 64) {
                showError('Private key must be 32 bytes (64 hex characters)');
                return;
            }

            try {
                showLoading(true);

                // Step 1: Fetch encrypted content from blockchain
                console.log('📡 Fetching encrypted content from blockchain...');
                const encryptedData = await fetchEncryptedContent(network, contract, tokenId);
                console.log('✅ Encrypted data retrieved');

                // Step 2: Parse private key
                const privateKeyBytes = hexToBytes(privateKeyHex);
                const privateKeyScalar = bufferToScalar(privateKeyBytes);

                // Verify public key
                const publicKeyPoint = window.RistrettoPoint.BASE.multiply(privateKeyScalar);
                const publicKeyBytes = publicKeyPoint.toRawBytes();
                const computedPubkey = btoa(String.fromCharCode(...publicKeyBytes));

                console.log('Owner pubkey (chain):', encryptedData.owner_pubkey_base64);
                console.log('Owner pubkey (computed):', computedPubkey);

                if (computedPubkey !== encryptedData.owner_pubkey_base64) {
                    throw new Error('Private key does not match the NFT owner. You do not own this NFT.');
                }

                console.log('✅ Key ownership verified');

                // Step 3: ElGamal decrypt to recover secret_point
                console.log('🔓 ElGamal decrypting...');
                const c1Bytes = base64ToBytes(encryptedData.elgamal_ciphertext.c1_base64);
                const c2Bytes = base64ToBytes(encryptedData.elgamal_ciphertext.c2_base64);

                const c1Point = window.RistrettoPoint.fromHex(c1Bytes);
                const c2Point = window.RistrettoPoint.fromHex(c2Bytes);

                // secret_point = C2 - sk * C1
                const secretPoint = c2Point.subtract(c1Point.multiply(privateKeyScalar));
                const secretPointBytes = secretPoint.toRawBytes();

                console.log('✅ Secret point recovered');

                // Step 4: Derive AES key from secret_point
                console.log('🔑 Deriving AES key...');
                const aesKey = await sha256(secretPointBytes);
                console.log('✅ AES key derived');

                // Step 5: Decrypt content
                console.log('🔐 Decrypting content...');
                const encryptedContentBytes = base64ToBytes(encryptedData.encrypted_content_base64);

                const iv = encryptedContentBytes.slice(0, 12);
                const authTag = encryptedContentBytes.slice(-16);
                const ciphertext = encryptedContentBytes.slice(12, -16);

                const decryptedBytes = await aesDecrypt(aesKey, iv, ciphertext, authTag);

                console.log('✅ Decryption successful!');
                console.log('Decrypted size:', decryptedBytes.length, 'bytes');

                // Check if content is binary (WASM) or text
                const isBinary = decryptedBytes[0] === 0x00 &&
                                decryptedBytes[1] === 0x61 &&
                                decryptedBytes[2] === 0x73 &&
                                decryptedBytes[3] === 0x6d; // WASM magic number

                showLoading(false);

                if (isBinary) {
                    // Download as WASM file
                    const blob = new Blob([decryptedBytes], { type: 'application/wasm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${tokenId}.wasm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    // Show success message
                    document.getElementById('content').innerHTML =
                        `<strong>✅ Binary file decrypted and downloaded!</strong><br><br>` +
                        `File: <code>${tokenId}.wasm</code><br>` +
                        `Size: ${decryptedBytes.length.toLocaleString()} bytes<br><br>` +
                        `Check your Downloads folder.`;
                    document.getElementById('result').classList.add('show');
                } else {
                    // Display as text
                    const decryptedContent = new TextDecoder().decode(decryptedBytes);
                    document.getElementById('content').textContent = decryptedContent;
                    document.getElementById('result').classList.add('show');
                }

            } catch (error) {
                showLoading(false);
                console.error('❌ Error:', error);
                showError(`Error: ${error.message}`);
            }
        };

        // Add Enter key support
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('input').forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        decryptContent();
                    }
                });
            });
        });
    </script>
</body>
</html>
